name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_key

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # O runner já possui PostgreSQL instalado (serviço desligado); o script
      # cria um cluster temporário, aplica as migrations e roda os testes.
      - run: bash scripts/test-db.sh
